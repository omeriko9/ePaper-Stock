# Publishes the web installer (web/) to GitHub Pages, with the images of the latest Release
# in firmware/. GitHub does not let a page download Release assets directly (CORS), so
# the site keeps its own copy.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::notice::No release yet. Push a v* tag first."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p site
          cp -r web/. site/
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir site/firmware
          test -f site/firmware/manifest.json
          ls -l site site/firmware
          echo "found=true" >> "$GITHUB_OUTPUT"

      - if: steps.release.outputs.found == 'true'
        uses: actions/configure-pages@v5

      - if: steps.release.outputs.found == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - if: steps.release.outputs.found == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
